<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    body { font-family: 'Arial', sans-serif; background-color: #0b0f1a; margin: 0; padding: 0; }
    .button { background-color: #6cf2c2; color: #0b0f1a !important; text-decoration: none; padding: 14px 32px; border-radius: 50px; font-weight: bold; font-size: 16px; display: inline-block; }
</style>
</head>
<body style="background-color: #0b0f1a; margin: 0; padding: 0; font-family: 'Arial', sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #0b0f1a; padding: 40px 0;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" border="0" style="background-color: #12182b; border-radius: 16px; border: 1px solid #1e293b; max-width: 600px; margin: 0 auto; width: 100%;">
                    <tr>
                        <td align="center" style="padding: 40px 20px 20px;">
                            <img src="cid:logo_main" alt="Syntax Academy" width="220" style="display: block; max-width: 100%; height: auto;">
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 20px 40px 40px; color: #cfd8ff; font-size: 16px; line-height: 1.6;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding: 20px; border-top: 1px solid #1e293b; font-size: 13px; color: #64748b; background-color: #0d1321; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px;">
                            &copy; {% now "Y" %} Syntax Academy. All Rights Reserved.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
